<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Poster Wall</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --posters-per-row: 10;
            --border-width: 4px;

            --bg-body: #050505;
            --bg-wall: #000;
            --bg-container: #111;
            --text-color: #fff;
            --text-shadow: 0px 4px 12px rgba(0, 0, 0, 1), 0px 1px 3px rgba(0, 0, 0, 0.8);
            --hover-filter: brightness(0.2) blur(2px);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-body: #f5f5f5;
                --bg-wall: #ffffff;
                --bg-container: #eaeaea;
                --text-color: #111;
                --text-shadow: 0px 4px 12px rgba(255, 255, 255, 1), 0px 1px 3px rgba(255, 255, 255, 0.9);
                --hover-filter: brightness(1.6) contrast(0.5) blur(3px);
            }
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: var(--bg-body);
            overflow-x: hidden;
            font-family: 'Montserrat', sans-serif;
            transition: background-color 0.3s ease;
        }

        #poster-wall {
            display: grid;
            grid-template-columns: repeat(var(--posters-per-row), 1fr);
            gap: var(--border-width);
            padding: var(--border-width);
            background-color: var(--bg-wall);
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }

        .poster-container {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            background-color: var(--bg-container);
            cursor: pointer;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        .poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
            filter 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .poster-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -30%) scale(0.9);
            width: 85%;
            text-align: center;
            color: var(--text-color);
            font-size: 1.15rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            word-wrap: break-word;
            text-shadow: var(--text-shadow);
        }

        .poster-container:hover .poster {
            filter: var(--hover-filter);
            transform: scale(1.08);
        }

        .poster-container:hover .poster-title {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        @media (max-width: 1024px) {
            :root {
                --posters-per-row: 4;
            }

            .poster-title {
                font-size: 1rem;
            }
        }

        @media (max-width: 768px) {
            :root {
                --posters-per-row: 3;
            }
        }

        @media (max-width: 480px) {
            :root {
                --posters-per-row: 2;
                --border-width: 2px;
            }

            .poster-title {
                font-size: 0.9rem;
                letter-spacing: 1px;
            }
        }
    </style>
</head>
<body>

<div id="poster-wall"></div>

<script>
    async function loadPosters() {
        try {
            // Check query param (?json=custom.json) first, fallback to 'movies.json'
            const urlParams = new URLSearchParams(window.location.search);
            const jsonPath = urlParams.get('json') || 'movies.json';

            const response = await fetch(jsonPath);
            const movies = await response.json();

            const wall = document.getElementById('poster-wall');
            const fragment = document.createDocumentFragment();

            movies.forEach(movie => {
                const container = document.createElement('div');
                container.className = 'poster-container';

                const img = document.createElement('img');
                img.src = movie.image;
                img.alt = movie.name || 'Movie Poster';
                img.className = 'poster';
                img.loading = 'lazy';

                const title = document.createElement('div');
                title.className = 'poster-title';
                title.textContent = movie.name;

                container.appendChild(img);
                container.appendChild(title);
                fragment.appendChild(container);
            });

            wall.appendChild(fragment);
        } catch (error) {
            console.error('Failed to load JSON:', error);
        }
    }
    loadPosters();
</script>

</body>
</html>
